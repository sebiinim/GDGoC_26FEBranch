# ==================================================================
# 3회차 · 1단계 — 정적 파일 서빙만 하는 가장 단순한 nginx 설정
# ==================================================================
#
# 하는 일: 빌드 결과물(dist/)을 그냥 파일로 내려줍니다. 그게 전부입니다.
#
# ★★★ 이 설정에는 SPA fallback 이 "일부러" 빠져 있습니다 ★★★
#
#   이 설정으로 앱을 띄우면 이렇게 됩니다.
#
#     http://localhost/           → 잘 됩니다 (index.html 파일이 실제로 있으니까)
#     화면에서 /about 으로 이동    → 잘 됩니다 (React Router 가 JS 로 처리하니까)
#     그 상태에서 F5 새로고침      → ❌ 404 Not Found
#     주소창에 /about 직접 입력    → ❌ 404 Not Found
#
#   왜냐하면 새로고침을 하면 브라우저가 nginx 에게
#   "GET /about 파일 주세요" 라고 진짜로 요청하기 때문입니다.
#   그런데 dist/ 안에는 about 이라는 파일이 없습니다. index.html 하나뿐입니다.
#   nginx 는 없는 파일을 달라고 하니 정직하게 404 를 돌려줍니다.
#
#   "개발 서버(npm run dev)에서는 잘 됐는데 배포하니까 404가 난다" 의 정체가 이것입니다.
#   Vite 개발 서버가 이 처리를 알아서 해주고 있었을 뿐입니다.
#
#   → 이 문제는 다음 파일 nginx-spa.conf 에서 고칩니다.
#
# 실습 순서: nginx.conf (여기) → nginx-spa.conf → nginx-proxy.conf
# ==================================================================

server {
    # 컨테이너 안에서 80 포트로 요청을 받습니다.
    listen 80;
    server_name localhost;

    # 정적 파일을 찾을 기준 디렉터리.
    # nginx:alpine 이미지의 기본 웹 루트가 이 경로입니다.
    # 여기에 우리가 dist/ 내용물을 복사해 넣습니다.
    root /usr/share/nginx/html;

    # 디렉터리를 요청했을 때 대신 내려줄 파일 이름
    index index.html;

    location / {
        # $uri            : 요청 경로와 똑같은 이름의 파일을 찾아본다
        # $uri/           : 디렉터리인지 찾아본다 (있으면 index.html)
        # =404            : 둘 다 없으면 404 를 낸다  ← 여기가 문제의 지점
        #
        # 마지막 인자를 /index.html 로 바꾸는 것이 SPA fallback 입니다.
        # 지금은 일부러 =404 로 두었습니다. 직접 404를 만나보세요.
        try_files $uri $uri/ /index.html;
    }
}
